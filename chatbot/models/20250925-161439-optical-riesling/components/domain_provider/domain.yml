version: '3.1'
intents:
- ask_condition_info
entities:
- condition
slots:
  condition:
    type: text
    mappings:
    - type: from_entity
      entity: condition
responses:
  utter_default:
  - text: Sorry, I don't have information on that condition.
actions:
- action_provide_condition_info
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
